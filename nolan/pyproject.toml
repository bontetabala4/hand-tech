[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsf-sign-recognition-engine"
version = "0.1.0"
description = "MVP engine for isolated French Sign Language sign recognition"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "mediapipe>=0.10,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.9,<1",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
