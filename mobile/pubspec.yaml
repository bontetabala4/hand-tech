name: handtech
description: Application mobile HandTech d'aide à la communication.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  camera: ^0.11.0+2
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  google_mlkit_translation: ^0.13.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - logo.jpeg
    - assets/branding/handtech.png
    - assets/branding/splash_mark.png
    - assets/branding/splash_wordmark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/handtech.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/handtech.png
    background_color: "#FFFFFF"
    theme_color: "#004CCA"
  windows:
    generate: true
    image_path: assets/branding/handtech.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/handtech.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_mark.png
  branding: assets/branding/splash_wordmark.png
  branding_bottom_padding: 48
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_mark.png
    branding: assets/branding/splash_wordmark.png
  web: true
