services:
  backend:
    build: ./backend
    container_name: handtech-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      TRANSLATION_TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
    depends_on:
      db:
        condition: service_started
      libretranslate:
        condition: service_healthy
    networks:
      - handtech-network

  db:
    image: postgres:16-alpine
    container_name: handtech-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - handtech-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - handtech-network

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: handtech-libretranslate
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "de,en,es,fr,it,pt"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - handtech-network

  # Placeholder : service IA à implémenter par le Dev IA (ticket à créer).
  # Décommenter une fois le Dockerfile ai/ disponible.
  # ai-service:
  #   build: ./ai
  #   container_name: handtech-ai
  #   ports:
  #     - "8001:8001"
  #   networks:
  #     - handtech-network

networks:
  handtech-network:
    driver: bridge

volumes:
  handtech-db-data:
  libretranslate-models:
